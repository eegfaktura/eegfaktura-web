:8080 {
    @encode_exts {
       path / *.html *.js *.css *.svg
    }
    encode @encode_exts gzip zstd

    handle /config/keycloak-config.json {
        root * /srv
        uri strip_prefix /config

        # enable template processing for files under the root
        templates {
            mime application/json
        }

        # ensure the response Content-Type is application/json for this path
        header Content-Type application/json
        header Cache-Control no-cache
        file_server
    }

    # Vite build output: a script or style sheet named <name>-<8 character hash>.js/.css never changes, the browser
    # keeps it for a year. The other files here come unchanged from public/assets (icons, images; a name like
    # leader-image-v1.png would look hashed) and are revalidated. No index.html fallback: a missing file is a 404,
    # never index.html with the long-lived header.
    handle /assets/* {
        root * /var/www/html/vfeeg-web
        @hashed {
            path_regexp ^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$
            file
        }
        @unhashed not path_regexp ^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$
        header @hashed Cache-Control "public, max-age=31536000, immutable"
        header @unhashed Cache-Control no-cache
        file_server
    }

    handle /* {
        root * /var/www/html/vfeeg-web
        try_files {path} /index.html
        # index.html names the current build's assets: the browser asks again every time (it gets a 304 if unchanged)
        header Cache-Control no-cache

        # index.html carries the optional Dynatrace RUM tag: rendered from DYNATRACE_RUM_URL at request time;
        # the template actions sit in HTML comments, so the file stays inert without Caddy (vite dev)
        @index path / /index.html
        templates @index {
            between <!--dt: :dt-->
        }
        file_server
    }
}